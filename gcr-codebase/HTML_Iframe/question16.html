<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>URI Encoding</title>
</head>
<body>

    <!-- Spaces are encoded using %20 and ampersand is encoded using %26 -->
    <p>
        Encoded URL:
    </p>

    <a href="https://example.com/search?query=HTML%20%26%20CSS">
        Search for HTML &amp; CSS
    </a>

</body>
</html>
