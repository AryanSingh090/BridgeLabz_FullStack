<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Form Security</title>
</head>
<body>

    <!-- Form autocomplete is disabled to reduce automatic storage of sensitive data -->
    <form action="#" method="post" autocomplete="off">

        <label for="username">Username:</label>
        <input type="text" id="username" name="username" required>
        <br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>
        <br><br>

        <input type="submit" value="Login">

    </form>

    <p>
        Turning off autocomplete can improve security by preventing browsers
        from automatically storing or filling sensitive information.
    </p>

</body>
</html>
