<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Quotations</title>
</head>
<body>

    <!-- Long quotation -->
    <blockquote>
        Learning HTML is an important step in understanding how web pages
        are created and how different elements work together.
        HTML uses &lt;tags&gt; to structure the content of a webpage.
    </blockquote>

    <!-- Short quotation -->
    <p>
        My teacher always says, <q>Practice makes perfect.</q>
    </p>

</body>
</html>
