<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Form Page</title>
</head>
<body>

    <!-- Form submits the result to the iframe below -->
    <form action="result.html" method="get" target="resultFrame">

        <label for="name">Enter Text:</label>
        <input type="text" id="name" name="name" required>

        <input type="submit" value="Submit">

    </form>

    <br>

    <!-- Result page will be displayed inside this iframe -->
    <iframe
        src="about:blank"
        name="resultFrame"
        width="500"
        height="200"
        title="Form Result">
    </iframe>

</body>
</html>
